# Gnomad, a fork of Felucca (see FORK.md). Not part of upstream Felucca.
# Build the package from source on GitHub, and publish the browser installer on GitHub Pages.
#   build: The Firmware Hub's shared workflow (zvenson/fm1-build@v1) runs tools/gn_ci_build.sh on the commit
#          ("GNOMAD V1 <commit>", dated by the commit, so a rebuild makes the same bytes) and attests the
#          package (gh attestation verify, the hub's "Built from source"). On a tag vX it publishes the release.
#   site:  web/make_site.py around the newest release's package (on a tag: that tag's release, just made):
#          the installer (Web MIDI, Chrome or Edge) and the editor, after the web tests (the update protocol
#          against a simulated FM-1). The page installs only released packages, never an untagged build.
#   deploy: GitHub Pages (Settings -> Pages -> Source: GitHub Actions); not for pull requests
# Release 12 (before this workflow) is rebuilt byte for byte with:
#   SOURCE_DATE_EPOCH=1792535274 tools/gn_ci_build.sh 115e11e   (firmware/ as at 3675315: SHA-256 8bab81bb...)
name: build and pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write        # the release (tags only)
      id-token: write        # the signing certificate
      attestations: write    # the attestation
    with:
      build: tools/gn_ci_build.sh
      packages: build/gnomad-*.fwsc
      test: python3 tests/install_test.py

  site:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web tests
        run: node web/test_web.mjs && node web/test_backup.mjs
      - name: The site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir packages
          if [ "$GITHUB_REF_TYPE" = tag ]; then release="$GITHUB_REF_NAME"; else release=""; fi
          gh release download $release -R "$GITHUB_REPOSITORY" -p 'gnomad-*.fwsc' -p SHA256SUMS -D packages
          pkgs=(packages/gnomad-*.fwsc)
          [ ${#pkgs[@]} -eq 1 ] || { echo "::error::the release has ${#pkgs[@]} gnomad-*.fwsc, the page installs one"; exit 1; }
          pkg=${pkgs[0]}
          sha=$(sha256sum "$pkg" | cut -d' ' -f1)   # SHA256SUMS names it with or without build/ (fm1-build's)
          grep -Eq "^$sha [ *]?(build/)?$(basename "$pkg")$" packages/SHA256SUMS ||
            { echo "::error::$pkg is not the file the release's SHA256SUMS lists"; exit 1; }
          version=$(basename "$pkg" .fwsc); version=${version#gnomad-}
          python3 web/make_site.py "$pkg" "$version" _site --name Gnomad \
              --source "${{ github.server_url }}/${{ github.repository }}"
          cp packages/SHA256SUMS _site/firmware/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
